version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: epinya-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: epinya
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: epinya-web
    environment:
      DATABASE_URL: "mysql://root:password@mysql:3306/epinya"
      JWT_SECRET: "production-jwt-secret-change-this"
      JWT_REFRESH_SECRET: "production-jwt-refresh-secret-change-this"
      CODE_ENC_KEY: "production-32-byte-key-change-this"
      PAYMENT_PROVIDER: "dummy"
      APP_URL: "http://localhost:3000"
      RESERVATION_TTL: "300"
      NODE_ENV: "production"
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "cd packages/db && npx prisma migrate deploy && cd ../../apps/web && npm start"

volumes:
  mysql_data:
